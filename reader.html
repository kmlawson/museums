    const v=Object.values(state.avail),yes=v.filter(x=>x===true).length, known=HTTP||Array.isArray(window.LOCAL_BOOKS);
    $('sum').textContent=known?(yes+' of '+order.length+' book files found '+(HTTP?'here':'in this folder')+(yes===0?(HTTP?': the books are not published with this site':': put the files in the books folder and run build_reader.py again'):'')):'Opened from disk without a file list: a book opens if its file is in the books folder';})();
}
function missing(n,p,pp,why){
  const d=D[n], printed=pp||printedOf(n,p);
  $('stage').innerHTML='<div class="msg"><h2>'+(why||'This book is not available here')+'</h2>'
   +'<p>The page reference you followed is:</p><p class="cite">'+d.c+(printed?' <span class="big">p. '+printed+'</span>':'')+(p&&d.k==='pdf'?' <span class="lab ui">(page '+p+' of the PDF file)</span>':'')+'</p>'
   +(why==='No books were found'?'<p><b>The reader looked in the <code>books</code> folder beside this page and found none of the '+order.length+' works.</b></p>':'')
   +'<p>The books this site is built from are under copyright and are not published with it, so the reader works only where the files are present, for example in a local copy of the site.</p>'
   +'<p class="ui lab">'+(HTTP?'To use it on your own computer, put the file below in a folder named <code>books</code> beside this page:':'This file was not in the <code>books</code> folder when the file list was last made. Put it there under exactly this name and run <code>build_reader.py</code> again:')+'<br><code>'+escH(d.f)+'</code></p>'
   +'<p class="ui"><a href="contents.html#t'+n+'">Contents and chapter overviews of this work</a></p></div>';
}
async function open(n,p,pp,push){
  if(!D[n]){$('stage').innerHTML='<div class="msg"><h2>Choose a book</h2><p>Pick a work from the list, or follow a page reference from the contents page or the approaches page.</p></div>';return;}
  state.t=n;state.p=Math.max(1,parseInt(p)||1);state.pp=pp||'';
  document.querySelectorAll('.bk').forEach(a=>a.classList.toggle('on',a.dataset.n===n));
  const on=document.querySelector('.bk.on');if(on&&push!==true)on.scrollIntoView({block:'center'});
  const d=D[n], isPdf=d.k==='pdf';$('ref').innerHTML=d.c;$('bar').style.display='flex';
  document.querySelectorAll('.pdfonly').forEach(x=>x.style.display=isPdf?'':'none');
  const max=(docN===n&&doc)?doc.numPages:(d.pp.length||0);if(max&&state.p>max)state.p=max;
  $('pg').value=state.p;$('pr').value=state.pp||printedOf(n,state.p);$('pr').style.display=$('lpr').style.display=(isPdf&&d.pp.length)?'':'none';
  $('prev').disabled=state.p<=1;$('next').disabled=max?state.p>=max:false;
  $('tab').href=d.u+(isPdf?'#page='+state.p:'');
  if(push){history.pushState(null,'','?t='+n+(isPdf?'&p='+state.p:''));}
  document.title=d.s+(isPdf?' p. '+($('pr').value||state.p):'')+' – Reader';
  const ok=await check(n);
  if(state.t!==n)return;
  if(ok===false){
    await Promise.all(order.map(check));if(state.t!==n)return;
    const any=Object.values(state.avail).some(x=>x===true);
    missing(n,state.p,pp,any?'':'No books were found');return;}
  if(!isPdf){
    $('stage').innerHTML='<div class="msg"><h2>This work is an EPUB</h2><p class="cite">'+d.c+'</p><p>EPUB files have no fixed pages, so the reader cannot show a page of it, and references to this work carry no page number.</p><p class="ui"><a href="'+d.u+'">Open or download the EPUB file</a>'+(ok===null?' (this works only if the file is in this folder)':'')+'</p><p class="ui"><a href="contents.html#t'+n+'">Contents and chapter overviews of this work</a></p></div>';return;}
  if(!window.pdfjsLib){nativeFrame(n);return;}       // PDF.js missing: fall back to the browser's own viewer
  try{
    if(!HTTP&&!(await readWrapped(n))&&!(await localFile(n))){
      if(!dirHandle)dirHandle=await kvGet('dir')||null;
      if(!(await localFile(n))&&!(await readDirect(n))){
        const srv=await findServer();
        if(srv){location.replace(srv+'/reader.html?t='+n+'&p='+state.p+(state.pp?'&pp='+encodeURIComponent(state.pp):''));return;}
        accessPanel(n);return;
      }
    }
    const dd=await loadDoc(n);if(state.t!==n)return;
    if(!dd){accessPanel(n);return;}
    if(state.p>dd.numPages){state.p=dd.numPages;$('pg').value=state.p;}
    $('next').disabled=state.p>=dd.numPages;$('of').textContent='of '+dd.numPages;
    await draw();
  }catch(e){
    if(HTTP&&/Missing PDF|404|Unexpected server response/i.test(String(e&&e.message))){missing(n,state.p,pp);return;}
    $('stage').innerHTML='<div class="msg"><h2>The page could not be drawn</h2><p class="cite">'+d.c+'</p><p class="ui lab">'+escH(String(e&&e.message||e))+'</p><p class="ui"><a href="'+d.u+'#page='+state.p+'" target="_blank" rel="noopener">Open the file with the browser instead</a></p></div>';
  }
}
function go(p){open(state.t,p,'',true);}
function wire(){
  $('prev').onclick=()=>go(state.p-1);$('next').onclick=()=>go(state.p+1);$('go').onclick=()=>go($('pg').value);
  $('zin').onclick=()=>{state.zoom=Math.min(3,state.zoom*1.2);if(doc)draw();};$('zout').onclick=()=>{state.zoom=Math.max(0.4,state.zoom/1.2);if(doc)draw();};$('zfit').onclick=()=>{state.zoom=1;if(doc)draw();};
  $('pg').addEventListener('keydown',e=>{if(e.key==='Enter')go($('pg').value)});
  $('pr').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const k=pdfOf(state.t,$('pr').value);if(k)go(k);else{$('pr').style.outline='2px solid var(--no)';setTimeout(()=>$('pr').style.outline='',900);}});
  document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!state.t||D[state.t].k!=='pdf'||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){if(!$('next').disabled){e.preventDefault();go(state.p+1);}}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){if(state.p>1){e.preventDefault();go(state.p-1);}}});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(doc&&docN===state.t&&$('stage').querySelector('.sheet'))draw();},200);});
  window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search);open(q.get('t'),q.get('p'),q.get('pp'));});
}
list();wire();open(qs.get('t'),qs.get('p'),qs.get('pp'));
</script></body></html>
